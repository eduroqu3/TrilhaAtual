target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "migrations",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "B008", # do not perform function calls in argument defaults
]

[lint.isort]
known-first-party = ["config", "apps"]
